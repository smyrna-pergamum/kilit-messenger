[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/kilit-messenger"
publish = false

[workspace.dependencies]
kilit-ipc = { path = "crates/kilit-ipc" }
kilit-klt = { path = "crates/kilit-klt" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# crypto dependencies are far too slow unoptimised (Argon2 at 256 MiB)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
