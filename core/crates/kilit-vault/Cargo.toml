[package]
name = "kilit-vault"
description = "Vault compartment: identity, Signal sessions, PIN and key derivation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kilit-ipc.workspace = true
kilit-klt.workspace = true
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
ed25519-dalek = "3.0.0"
libcrux-ml-dsa = { version = "=0.0.11", default-features = false, features = ["std", "mldsa65"] }
ciborium = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
secrecy = "0.10.3"
zeroize = "1.9.1"
getrandom = "0.4.3"
# Signal's own implementation (AGPL-3.0-only, which GPLv3 section 13 lets
# Kilit combine with), pinned to a release commit
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "b2a5c30f3245c1bcad04b27b1e752a38321c793d" }
async-trait = "0.1.79"
rand = "0.9.4"
base64 = "0.22"

[dev-dependencies]
age = { version = "=0.12.1", default-features = false }

[lints]
workspace = true
