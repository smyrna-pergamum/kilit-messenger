[package]
name = "kilit-ffi"
description = "Flutter bindings; key material never crosses back to the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kilit-ipc.workspace = true
kilit-klt.workspace = true
kilit-parse.workspace = true
kilit-net = { path = "../kilit-net" }
base64 = "0.22"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
serde_bytes = "0.11.19"
sha2 = "0.11.1"
age = { version = "=0.12.1", default-features = false }
kilit-vault = { path = "../kilit-vault" }
kilit-store = { path = "../kilit-store" }
flutter_rust_bridge = "=2.13.0"
ciborium = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
secrecy = "0.10.3"
getrandom = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

# Not the workspace lints: the generated binding code (src/frb_generated.rs)
# needs unsafe for the C ABI. Hand-written modules deny it themselves.
[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
